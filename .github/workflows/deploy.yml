name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # serverdagi dotnet --version ga moslang

      - name: Publish
        run: dotnet publish OnlineShop/OnlineShop.csproj -c Release -o publish

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Serverga yuborish
        run: |
          rsync -az --exclude 'appsettings*.json' publish/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/onlineshop-api/

      - name: Restart
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo systemctl restart onlineshop"
